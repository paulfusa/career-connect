<!doctype html>
<html lang="en">
	<head>
		<script>
			(function () {
				try {
					const saved = localStorage.getItem('careerconnect-theme');

					const dark = saved === 'dark' ||
						(saved !== 'light' &&
							window.matchMedia('(prefers-color-scheme: dark)').matches);

					document.documentElement.classList.toggle('dark', dark);
				} catch {
					// Keep the default theme if storage is unavailable.
				}
			})();
		</script>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Hanken+Grotesk:wght@400..600&display=swap"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
